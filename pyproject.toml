[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiago-ons-app"
version = "1.0.0"
description = "Integração de assistente de IA com dados abertos do ONS (TIAGO)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-openai",
    "pydantic",
    "mcp-tiago-dados-abertos"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=backend --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"] # Regras padrão de erros e sintaxe
ignore = []

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*"]